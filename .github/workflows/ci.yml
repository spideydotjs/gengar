name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install backend dependencies
        run: npm ci

      - name: Syntax check backend files
        run: |
          node --check index.js
          node --check src/ahmia.js
          node --check src/blockchainScraper.js
          node --check src/cryptoForensics.js
          node --check src/logger.js
          node --check src/prober.js
          node --check src/screenshot.js
          node --check src/torClient.js
          node --check src/walletScanner.js
          node --check src/routes/search.js

      - name: Run unit test suite
        run: npm test

      - name: Install and build React client
        run: |
          cd client
          npm ci
          npm run build
