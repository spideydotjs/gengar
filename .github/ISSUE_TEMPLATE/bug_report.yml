name: 🐛 Bug Report
description: Create a report to help us fix a bug in Gengar
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please check existing issues first before submitting.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: What operating system, Node.js version, and deployment mode (Docker vs Local) are you running?
      placeholder: "e.g., Ubuntu 24.04, Node.js v20.12.0, Docker Compose"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Start Tor daemon
        2. Run `npm start`
        3. Make request to /api/search?q=cyber
        4. See error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs / Output
      description: Paste any terminal logs or browser console errors here.
      render: shell
