name: 💡 Feature Request
description: Suggest an idea or enhancement for Gengar
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make Gengar better? We'd love to hear it!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of what the problem or limitation is.
      placeholder: "I'm always frustrated when..."
  - type: textarea
    id: solution
    attributes:
      label: Describe the Solution You'd Like
      description: A clear description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe Alternatives You've Considered
      description: Any alternative solutions or features you've looked into.
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or references (e.g. OFAC bulletins, blockchain APIs) here.
